<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Travel Journal</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F1F6FA;color:#44504E;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#0E1716;color:#C0CCCA}}</style></head>
<body><p id="m">불러오는 중…</p>
<script>
(async () => {
  const say = t => { document.getElementById('m').textContent = t; };
  const h = location.hash.match(/k=([A-Za-z0-9_-]{30,})/);
  let k = h ? h[1] : null;
  try { if (k) localStorage.setItem('dxb-k', k); else k = localStorage.getItem('dxb-k'); } catch (e) {}
  if (!k) { say('처음 받은 링크(끝에 #k=… 가 붙은 주소) 그대로 열어 주세요.'); return; }
  try {
    const res = await fetch('site.bin', {cache: 'no-cache'});
    if (!res.ok) throw new Error('파일을 못 받았어요 (' + res.status + ')');
    const buf = new Uint8Array(await res.arrayBuffer());
    const raw = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((k.length + 3) % 4)), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12));
    if (h) history.replaceState(null, '', location.pathname);
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { if (!h) localStorage.removeItem('dxb-k'); } catch (_) {}
    say('열 수 없어요. 받은 링크 전체로 다시 열어 주세요.');
  }
})();
</script></body></html>
